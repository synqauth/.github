name: Feature request
description: Suggest a change to what this repository does.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: The change you have in mind, and how you'd use it.
  - type: textarea
    id: alternatives
    attributes:
      label: What you've tried
      description: Workarounds or other approaches you've considered.
