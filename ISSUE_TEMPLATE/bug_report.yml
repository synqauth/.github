name: Bug report
description: Something in this repository doesn't work the way its docs say.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security problems don't go here. See https://github.com/synqauth/.github/blob/main/SECURITY.md
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest steps or code that show the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The package version or the commit you're on.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Runtime, framework and OS, for example Node 24, Next.js 16, macOS 26.
  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: Remove any secrets, keys or personal data before you paste.
      render: text
